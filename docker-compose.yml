services:

  # ─────────────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: site-yonetim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-site_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-site_pass}
      POSTGRES_DB: ${POSTGRES_DB:-site_yonetim}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-site_user} -d ${POSTGRES_DB:-site_yonetim}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  # ─────────────────────────────────────────────
  # pgAdmin 4  (sadece geliştirme ortamında kullan)
  # http://localhost:5050
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: site-yonetim-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    profiles:
      - tools

  # ─────────────────────────────────────────────
  # Go Backend  (air ile hot-reload)
  # http://site_yonetim.localhost/api veya http://localhost:8080
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: site-yonetim-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-site_user}:${POSTGRES_PASSWORD:-site_pass}@postgres:5432/${POSTGRES_DB:-site_yonetim}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://${SITE_URL:-site_yonetim.localhost},https://${SITE_URL:-site_yonetim.localhost}
      INITIAL_OWNER_PHONE: ${INITIAL_OWNER_PHONE:-05000000000}
      INITIAL_OWNER_EMAIL: ${INITIAL_OWNER_EMAIL:-admin@siteyonetim.local}
      INITIAL_OWNER_PASSWORD: ${INITIAL_OWNER_PASSWORD:-AdminPassword123!}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - traefik_webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_webgateway"
      # Route /api to backend service
      - "traefik.http.routers.site-yonetim-backend.rule=Host(`${SITE_URL:-site_yonetim.localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.site-yonetim-backend.priority=100"
      - "traefik.http.services.site-yonetim-backend.loadbalancer.server.port=8080"
    profiles:
      - app

  # ─────────────────────────────────────────────
  # React Frontend  (Vite dev server)
  # http://site_yonetim.localhost veya http://localhost:5173
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: site-yonetim-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - default
      - traefik_webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_webgateway"
      # Route all remaining paths to frontend SPA
      - "traefik.http.routers.site-yonetim-frontend.rule=Host(`${SITE_URL:-site_yonetim.localhost}`)"
      - "traefik.http.routers.site-yonetim-frontend.priority=10"
      - "traefik.http.services.site-yonetim-frontend.loadbalancer.server.port=5173"
    profiles:
      - app

volumes:
  postgres_data:
  pgadmin_data:

networks:
  default:
  traefik_webgateway:
    external: true
