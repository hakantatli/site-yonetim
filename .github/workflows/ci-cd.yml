name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend Test & Lint (Cloud Runner)
  # ==========================================
  test-backend:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: backend/go.sum

      - name: Run go vet
        working-directory: ./backend
        run: go vet ./...

      - name: Run Unit Tests with Race & Coverage
        working-directory: ./backend
        env:
          GOTOOLCHAIN: local
        run: go test -v -race -cover ./...

  # ==========================================
  # 2. Frontend Test, Lint & Build (Cloud Runner)
  # ==========================================
  test-frontend:
    name: Frontend Tests & Build (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter (oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Run Unit Tests (vitest)
        working-directory: ./frontend
        run: npm run test

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build

  # ==========================================
  # 3. Deploy (Self-Hosted Runner on Server)
  # Only executes if all tests succeed on push to main
  # ==========================================
  deploy:
    name: Deploy to Server
    needs: [ test-backend, test-frontend ]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          echo "🚀 Deployment starting on self-hosted runner..."
          
          # Optional: Inject .env from GitHub Secrets if configured
          if [ -n "$PROD_ENV" ]; then
            echo "🔐 Injected production .env from GitHub Secrets."
            echo "$PROD_ENV" > .env
          elif [ -f .env ]; then
            echo "ℹ️ Using existing local .env file on server."
          else
            echo "⚠️ [Warning] No .env file found and PROD_ENV secret is empty. Docker compose may fail if required variables are missing."
          fi
          
          # Deploy using production compose
          if [ -f docker-compose.prod.yml ]; then
            echo "📦 Building and deploying with docker-compose.prod.yml..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            
            echo "🧹 Cleaning unused dangling Docker images..."
            docker image prune -f || true
            
            echo "🔍 Container Status:"
            docker compose -f docker-compose.prod.yml ps
          elif [ -f docker-compose.yml ]; then
            echo "📦 Building and deploying with docker-compose.yml..."
            docker compose up -d --build --remove-orphans
            docker image prune -f || true
            docker compose ps
          else
            echo "❌ No docker-compose file found."
            exit 1
          fi
          
          echo "✅ BinaPortal deployed successfully!"
