name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend Test & Lint (Cloud Runner)
  # ==========================================
  test-backend:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "backend/go.mod"
          cache-dependency-path: backend/go.sum

      - name: Run go vet
        working-directory: ./backend
        run: go vet ./...

      - name: Run Unit Tests with Race & Coverage
        working-directory: ./backend
        env:
          GOTOOLCHAIN: local
        run: go test -v -race -cover ./...

  # ==========================================
  # 2. Frontend Test, Lint & Build (Cloud Runner)
  # ==========================================
  test-frontend:
    name: Frontend Tests & Build (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter (oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Run Unit Tests (vitest)
        working-directory: ./frontend
        run: npm run test

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build

  # ==========================================
  # 3. Deploy (Self-Hosted Runner on Server)
  # Only executes if all tests succeed on push to main
  # ==========================================
  deploy:
    name: Deploy to Server
    needs: [test-backend, test-frontend]
    runs-on: self-hosted
    environment: ENV
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INITIAL_OWNER_PHONE: ${{ secrets.INITIAL_OWNER_PHONE }}
          INITIAL_OWNER_EMAIL: ${{ secrets.INITIAL_OWNER_EMAIL }}
          INITIAL_OWNER_PASSWORD: ${{ secrets.INITIAL_OWNER_PASSWORD }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          SITE_URL: ${{ secrets.SITE_URL }}
          RUN_MIGRATIONS: ${{ secrets.RUN_MIGRATIONS }}
          OCI_BACKUP_PAR_URL: ${{ secrets.OCI_BACKUP_PAR_URL }}
        run: |
          echo "Deployment starting on self-hosted runner..."

          # 1. If PROD_ENV secret block is provided, write it to .env
          if [ -n "$PROD_ENV" ]; then
            echo "Injected production .env from PROD_ENV secret."
            echo "$PROD_ENV" > .env
          elif [ ! -f .env ] || [ -n "$JWT_SECRET" ]; then
            # 2. Construct or overwrite .env from individual GitHub secrets
            echo "Constructing .env from individual GitHub secrets..."
            echo "SITE_NAME=${SITE_NAME:-binaportal}" > .env
            echo "SITE_URL=${SITE_URL:-binaportal.com}" >> .env
            echo "POSTGRES_USER=${POSTGRES_USER:-binaportal_user}" >> .env
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
            echo "POSTGRES_DB=${POSTGRES_DB:-binaportal}" >> .env
            echo "JWT_SECRET=${JWT_SECRET}" >> .env
            echo "JWT_ACCESS_TTL_MINUTES=15" >> .env
            echo "JWT_REFRESH_TTL_DAYS=7" >> .env
            echo "INITIAL_OWNER_PHONE=${INITIAL_OWNER_PHONE:-05000000000}" >> .env
            echo "INITIAL_OWNER_EMAIL=${INITIAL_OWNER_EMAIL:-admin@binaportal.com}" >> .env
            echo "INITIAL_OWNER_PASSWORD=${INITIAL_OWNER_PASSWORD}" >> .env
            echo "RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}" >> .env
            echo "VITE_API_URL=/api/v1" >> .env
            if [ -n "$OCI_BACKUP_PAR_URL" ]; then
              echo "OCI_BACKUP_PAR_URL=${OCI_BACKUP_PAR_URL}" >> .env
            fi
          else
            echo "Using existing local .env file on server."
            if [ -n "$OCI_BACKUP_PAR_URL" ] && ! grep -q "^OCI_BACKUP_PAR_URL=" .env; then
              echo "OCI_BACKUP_PAR_URL=${OCI_BACKUP_PAR_URL}" >> .env
            fi
          fi

          if [ -f docker-compose.prod.yml ]; then
            COMPOSE_FILE="docker-compose.prod.yml"
          elif [ -f docker-compose.yml ]; then
            COMPOSE_FILE="docker-compose.yml"
          else
            echo "Error: No docker-compose file found."
            exit 1
          fi

          # Pre-deployment Database Backup
          echo "Checking database status for pre-deployment backup..."
          if docker compose -f "$COMPOSE_FILE" ps postgres 2>/dev/null | grep -qE "Up|running"; then
            if docker compose -f "$COMPOSE_FILE" ps backup 2>/dev/null | grep -qE "Up|running"; then
              echo "Executing backup via backup container..."
              docker compose -f "$COMPOSE_FILE" exec -T backup /backup.sh || echo "Warning: Backup container execution failed, continuing..."
            else
              echo "Executing direct pg_dump backup from postgres container..."
              mkdir -p ./backup
              TIMESTAMP=$(date +"%Y%m%d%H%M_predeploy")
              docker compose -f "$COMPOSE_FILE" exec -T postgres pg_dump -U "${POSTGRES_USER:-binaportal_user}" -d "${POSTGRES_DB:-binaportal}" --clean --if-exists --no-owner --no-privileges | gzip -9 > "./backup/${TIMESTAMP}.${POSTGRES_DB:-binaportal}.sql.gz" || echo "Warning: Direct pg_dump failed, continuing..."
            fi
          else
            echo "PostgreSQL container is not currently running. Skipping pre-deployment backup."
          fi

          # Deploy using compose
          echo "Building and deploying with $COMPOSE_FILE..."
          docker compose -f "$COMPOSE_FILE" up -d --build --remove-orphans

          echo "Cleaning unused dangling Docker images..."
          docker image prune -f || true

          echo "Container Status:"
          docker compose -f "$COMPOSE_FILE" ps

          echo "BinaPortal deployed successfully."
